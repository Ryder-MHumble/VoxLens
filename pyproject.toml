[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "social-deepresearch-mvp"
version = "0.1.0"
description = "MVP for cross-platform social video research with OpenCLI, MediaCrawler, and ffmpeg hooks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
social-research = "social_deep_research.cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["social_deep_research"]