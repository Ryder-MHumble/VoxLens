[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxlens-research-cli"
version = "0.1.0"
description = "VoxLens research CLI for integrated social-video collection and report generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "imageio-ffmpeg>=0.6.0",
]

[project.scripts]
voxlens-research = "voxlens_research.cli:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["packages/research_cli/voxlens_research"]
